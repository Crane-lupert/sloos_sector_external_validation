[project]
name = "sloos-sector-external-validation"
version = "0.0.1"
description = "S3 — Path B international replication of S1 SLOOS sectoral decomposition. UK (BoE Credit Conditions Survey) + Eurozone (ECB Bank Lending Survey) × STOXX 600 cross-country external validation. QR Scout discovery alpha-research (Macro/Credit international extension, fork from S1 sloos_sector_cross_section close commit 4ce5c49)."
requires-python = ">=3.11"
dependencies = [
  "fredapi>=0.5",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "requests>=2.31",
  "duckdb>=1.5.2",
  "pyarrow>=14.0",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "tabula-py>=2.9",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "mypy>=1.7",
  "jupyter>=1.0",
  "ipykernel>=6.27",
  "streamlit>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sloos_sector_external_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
